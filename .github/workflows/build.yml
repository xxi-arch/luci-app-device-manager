name: Build OpenWrt Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt SDK release version'
        required: false
        default: '24.10.0'
      openwrt_arch:
        description: 'OpenWrt target architecture'
        required: false
        default: 'x86/64'

jobs:
  build:
    name: Build package (${{ matrix.target }}-${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '24.10.0'
            target: 'x86/64'
            sdk_url: 'https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: package-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget zstd

      - name: Download and unpack OpenWrt SDK
        run: |
          mkdir -p sdk
          wget -qO sdk.tar.zst "${{ matrix.sdk_url }}"
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm -f sdk.tar.zst

      - name: Configure feeds and link package
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base
          mkdir -p package/luci-app-device-manager
          cp -r ../package-src/* package/luci-app-device-manager/
          printf "CONFIG_PACKAGE_luci-app-device-manager=m\n" >> .config
          make defconfig

      - name: Compile luci-app-device-manager
        run: |
          cd sdk
          make package/luci-app-device-manager/compile V=s -j$(nproc)

      - name: Organize output packages
        run: |
          mkdir -p bin-packages
          find sdk/bin/packages/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} bin-packages/ \;
          ls -la bin-packages/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-device-manager-${{ matrix.version }}
          path: bin-packages/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin-packages/*
          draft: false
          prerelease: false
          generate_release_notes: true

