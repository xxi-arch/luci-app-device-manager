name: Build OpenWrt Package

on:
  push:
    branches: ['master', 'main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release version or SNAPSHOT'
        required: false
        default: 'SNAPSHOT'
      openwrt_arch:
        description: 'OpenWrt target/subtarget'
        required: false
        default: 'x86/64'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version || 'SNAPSHOT' }}
      OPENWRT_TARGET: ${{ inputs.openwrt_arch || 'x86/64' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: package-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget zstd

      - name: Resolve requested official SDK
        id: sdk
        run: python3 package-src/tools/resolve-sdk.py "$OPENWRT_VERSION" "$OPENWRT_TARGET" >> "$GITHUB_OUTPUT"

      - name: Download, verify and unpack OpenWrt SDK
        env:
          SDK_URL: ${{ steps.sdk.outputs.sdk_url }}
          SDK_SHA256: ${{ steps.sdk.outputs.sdk_sha256 }}
        run: |
          mkdir -p sdk
          wget -qO sdk.tar "$SDK_URL"
          printf '%s  sdk.tar\n' "$SDK_SHA256" | sha256sum -c -
          tar -xf sdk.tar -C sdk --strip-components=1
          rm -f sdk.tar

      - name: Configure feeds and copy package
        run: |
          cd sdk
          ./scripts/feeds update -a
          python3 ../package-src/tools/prepare-upstream.py feeds/luci
          ./scripts/feeds update -i luci
          ./scripts/feeds install luci-app-device-manager
          ./scripts/feeds install luci-base rpcd-mod-file rpcd-mod-iwinfo ip-tiny jshn
          python3 ../package-src/tools/configure-sdk.py .
          make defconfig

      - name: Compile luci-app-device-manager
        run: |
          cd sdk
          PACKAGE_VERSION="$(python3 ../package-src/tools/package-version.py)"
          make package/feeds/luci/luci-app-device-manager/compile V=s -j"$(nproc)" \
            PKG_SRC_VERSION="$PACKAGE_VERSION" PKG_PO_VERSION="$PACKAGE_VERSION"

      - name: Collect plugin packages
        run: |
          mkdir -p bin-packages
          find sdk/bin/packages/ -type f \( -name '*device-manager*.ipk' -o -name '*device-manager*.apk' \) -exec cp {} bin-packages/ \;
          test -n "$(find bin-packages -type f -print -quit)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-device-manager-${{ env.OPENWRT_VERSION }}
          path: bin-packages/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: luci-app-device-manager-SNAPSHOT
          path: bin-packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin-packages/*
          draft: false
          prerelease: false
          generate_release_notes: true
