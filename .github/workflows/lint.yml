name: Code Lint & Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON syntax
        run: |
          jq -e . root/usr/share/luci/menu.d/luci-app-device-manager.json
          jq -e . root/usr/share/rpcd/acl.d/luci-app-device-manager.json

      - name: Validate JavaScript syntax
        run: |
          node -c htdocs/luci-static/resources/view/device-manager/devices.js

      - name: Validate Shell script syntax
        run: |
          bash -n tools/deploy.sh
          sh -n root/etc/uci-defaults/80_device_manager
          sh -n root/usr/libexec/rpcd/luci.device-manager

      - name: Run automated unit tests
        run: |
          node test/test_device_manager.js

