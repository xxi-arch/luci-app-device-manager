name: Code Lint & Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout official LuCI reference
        uses: actions/checkout@v4
        with:
          repository: openwrt/luci
          ref: master
          path: luci-reference

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JSON syntax
        run: |
          jq -e . root/usr/share/luci/menu.d/luci-app-device-manager.json
          jq -e . root/usr/share/rpcd/acl.d/luci-app-device-manager.json

      - name: Validate JavaScript syntax
        run: |
          find htdocs test -name '*.js' -print0 | xargs -0 -n 1 node -c

      - name: Install shell and translation test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox gettext

      - name: Validate Shell script syntax
        run: |
          bash -n tools/deploy.sh
          sh -n root/etc/uci-defaults/80_device_manager
          sh -n root/usr/libexec/rpcd/luci.device-manager

      - name: Run automated unit tests
        run: |
          node --test test/test_*.js

      - name: Validate translations and SDK resolution
        run: |
          msgfmt --check -o /tmp/device-manager.mo po/zh_Hans/device-manager.po
          python3 -B tools/update-translations.py --check --luci-dir luci-reference
          python3 -B -m unittest discover -s test -p 'test_*.py'

      - name: Validate exported package with official LuCI ESLint
        run: |
          npm install --prefix luci-reference --ignore-scripts --no-audit --no-fund eslint@9
          python3 -B tools/prepare-upstream.py luci-reference
          cd luci-reference
          ./node_modules/.bin/eslint applications/luci-app-device-manager

      - name: Verify whitespace
        run: git diff --check
